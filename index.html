<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e5df">
<title>极简客厅 · 3D 效果图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#e9e5df;position:fixed;inset:0;width:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#22201d}
  /* canvas 必须由 CSS 明确定尺寸：setSize(w,h,false) 不写 style，
     而 canvas 是替换元素，width:auto 会回退到内在尺寸(=视口×DPR)，导致画面被放大偏移 */
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;left:0;right:0;display:flex;gap:8px;padding:12px 14px;z-index:5;pointer-events:none}
  .hud.top{top:0;align-items:flex-start;justify-content:space-between;
    background:linear-gradient(180deg,rgba(238,234,228,.92),rgba(238,234,228,0))}
  .hud.bot{bottom:0;flex-direction:column;padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(238,234,228,.94),rgba(238,234,228,0))}

  .title{font-size:15px;font-weight:650;letter-spacing:.3px;line-height:1.35}
  .title small{display:block;font-size:11px;font-weight:400;opacity:.6;letter-spacing:.4px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;justify-content:flex-end;max-width:66%}
  .btn{border:1px solid rgba(34,32,29,.16);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border-radius:999px;padding:7px 12px;font-size:12px;line-height:1;cursor:pointer;white-space:nowrap;
    transition:.18s;font-family:inherit;color:#22201d}
  .btn:active{transform:scale(.96)}
  .btn.on{background:#22201d;color:#f3efe9;border-color:#22201d}
  @media (max-width:430px){ .btn{padding:6px 9px;font-size:11px} .title{font-size:13px} }

  #chips{display:flex;gap:7px;overflow-x:auto;pointer-events:auto;padding:2px 0 8px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid rgba(34,32,29,.14);background:rgba(255,255,255,.62);
    border-radius:999px;padding:6px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;transition:.18s}
  .chip.on{background:#22201d;color:#f3efe9;border-color:#22201d}

  #card{position:fixed;left:14px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:270px;z-index:6;
    background:rgba(252,251,249,.9);backdrop-filter:blur(14px);border:1px solid rgba(34,32,29,.1);
    border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(40,34,26,.14);
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:.24s cubic-bezier(.2,.8,.3,1)}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card .k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.45}
  #card .n{font-size:17px;font-weight:660;margin:3px 0 5px}
  #card .d{font-size:12px;line-height:1.6;opacity:.72}
  #card .row{display:flex;gap:6px;margin-top:9px}
  #card .mini{border:1px solid rgba(34,32,29,.16);border-radius:8px;padding:5px 9px;font-size:11px;
    background:transparent;cursor:pointer;font-family:inherit;color:#22201d}
  #card .act{font-size:11px;letter-spacing:.4px;margin-top:8px;min-height:14px;color:#4b7a45;opacity:0;
    transition:opacity .25s}
  #card .act.show{opacity:1}

  #dot{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;z-index:4;
    background:#2f6bff;box-shadow:0 0 0 4px rgba(47,107,255,.22);opacity:0;transition:opacity .2s;pointer-events:none}
  #dot.show{opacity:1;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(47,107,255,.22)}50%{box-shadow:0 0 0 9px rgba(47,107,255,.08)}}

  #tip{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:11.5px;opacity:.5;z-index:5;pointer-events:none;max-width:86vw;text-align:center;line-height:1.5;
    transition:opacity .5s}

  #load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#e9e5df;transition:opacity .6s}
  #load.gone{opacity:0;pointer-events:none}
  #load .l{text-align:center}
  #load .b{width:150px;height:2px;background:rgba(34,32,29,.12);border-radius:2px;overflow:hidden;margin:12px auto 0}
  #load .b i{display:block;height:100%;width:35%;background:#22201d;border-radius:2px;animation:slide 1.1s infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}
  #load p{font-size:12px;letter-spacing:2px;opacity:.55}
  @media (max-width:420px){#card{left:10px;right:10px;max-width:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud top">
  <div class="title">极简暖调客厅 · 3D 方案<small id="sub">WARM MINIMAL LIVING ROOM — 全屋俯瞰</small></div>
  <div class="btns">
    <button class="btn" id="bDay">日光</button>
    <button class="btn" id="bSpin">自转</button>
    <button class="btn" id="bReset">复位</button>
  </div>
</div>

<div id="dot"></div>

<div id="card">
  <div class="k" id="cardK">SELECTED</div>
  <div class="n" id="cardN">—</div>
  <div class="d" id="cardD">—</div>
  <div class="row">
    <button class="mini" id="cardFocus">聚焦此物</button>
    <button class="mini" id="cardClose">关闭</button>
  </div>
  <div class="act" id="cardAct"></div>
</div>

<div class="hud bot">
  <div id="chips"></div>
</div>
<div id="tip">单指拖拽平移 · 双指捏合缩放 · 双指拖动旋转 · 点击进入房间/家具 · 双击灯/电视可开关</div>

<div id="load"><div class="l"><p>BUILDING SCENE</p><div class="b"><i></i></div></div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 基础 ---------- */
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
} catch(e) {
  document.getElementById('load').innerHTML =
    '<div class="l"><p style="letter-spacing:1px">当前浏览器未启用 WebGL</p>' +
    '<p style="margin-top:8px;letter-spacing:0">请在设置中开启硬件加速后重试</p></div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

// 以画布实际布局尺寸为准（手机地址栏伸缩时 innerHeight 与可视区常不一致）
let VW = innerWidth, VH = innerHeight, RLEFT = 0, RTOP = 0;
function measure(){
  const r = canvas.getBoundingClientRect();
  // 布局尺寸异常时退回 visual viewport，避免 0 尺寸导致画面畸变
  VW = r.width  > 8 ? r.width  : (window.visualViewport?.width  || innerWidth);
  VH = r.height > 8 ? r.height : (window.visualViewport?.height || innerHeight);
  RLEFT = r.left; RTOP = r.top;
}
measure();
renderer.setSize(VW, VH, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e5df);
scene.fog = new THREE.Fog(0xe9e5df, 300, 1600);

const camera = new THREE.PerspectiveCamera(48, VW/VH, 0.1, 900);
camera.position.set(11, 8, 13);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 1.0, -0.3);
controls.minDistance = 0.6;
controls.maxDistance = 320;
controls.zoomSpeed = 1.1;
controls.panSpeed = 1.2;
controls.screenSpacePanning = true;
controls.touches.ONE = THREE.TOUCH.PAN;          // 单指按住 → 拖拽平移
controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE; // 双指捏合 → 缩放；双指拖动 → 旋转
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
controls.maxPolarAngle = Math.PI * 0.497;
controls.autoRotateSpeed = 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- 程序化贴图 ---------- */
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function T(c, rx=1, ry=1){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function noise(ctx,w,h,a,step=1){
  for(let i=0;i<w*h*0.25;i++){
    ctx.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},${a})`;
    ctx.fillRect(Math.random()*w|0, Math.random()*h|0, step, step);
  }
}
// 橡木地板
function woodTex(){
  const [c,x]=cv(1024,1024), planks=7, ph=1024/planks;
  x.fillStyle='#c9a578'; x.fillRect(0,0,1024,1024);
  for(let p=0;p<planks;p++){
    const y0=p*ph, tone=(Math.random()*14-7)|0;
    x.fillStyle=`rgb(${201+tone},${164+tone},${119+tone})`; x.fillRect(0,y0,1024,ph);
    for(let g=0;g<70;g++){ // 木纹
      const gy=y0+Math.random()*ph, amp=Math.random()*4+1, w=1.6+Math.random()*1.4;
      x.strokeStyle=`rgba(${130+Math.random()*40|0},${92+Math.random()*30|0},${58+Math.random()*24|0},${.05+Math.random()*.09})`;
      x.lineWidth=w; x.beginPath(); x.moveTo(0,gy);
      for(let sx=0;sx<=1024;sx+=32) x.lineTo(sx, gy+Math.sin(sx*0.007+g)*amp);
      x.stroke();
    }
    x.fillStyle='rgba(90,62,40,.30)'; x.fillRect(0,y0+ph-2,1024,2); // 板缝
    for(let s=0;s<3;s++){ const sx=Math.random()*1024|0; x.fillStyle='rgba(90,62,40,.22)'; x.fillRect(sx,y0,2,ph); }
  }
  noise(x,1024,1024,.03,2);
  return c;
}
// 墙面微肌理
function plasterTex(){
  const [c,x]=cv(512,512);
  x.fillStyle='#efece7'; x.fillRect(0,0,512,512);
  noise(x,512,512,.022,1);
  return c;
}
// 地毯织纹
function rugTex(){
  const [c,x]=cv(512,512);
  x.fillStyle='#b7b0a5'; x.fillRect(0,0,512,512);
  for(let i=0;i<512;i+=3){ x.fillStyle=`rgba(255,255,255,${.05+Math.random()*.05})`; x.fillRect(0,i,512,1); x.fillRect(i,0,1,512); }
  noise(x,512,512,.06,1);
  return c;
}
// 藤编
function caneTex(){
  const [c,x]=cv(256,256);
  x.fillStyle='#d8b47e'; x.fillRect(0,0,256,256);
  const s=32;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const over=(i+j)%2===0;
    x.fillStyle=over?'#e6c695':'#c39a64';
    x.fillRect(i*s+2,j*s+2,s-4,s-4);
    x.strokeStyle='rgba(120,84,44,.35)'; x.lineWidth=1.5;
    x.strokeRect(i*s+2,j*s+2,s-4,s-4);
  }
  noise(x,256,256,.05,1);
  return c;
}
// 条纹（粉/砖红）
function stripeTex(){
  const [c,x]=cv(64,256);
  const bands=[['#e7b8b3',0],['#c4685c',14],['#e7b8b3',26],['#b8564a',40],['#d99f97',54]];
  x.fillStyle='#e0aca6'; x.fillRect(0,0,64,256);
  for(let y=0;y<256;y+=64){
    let off=0;
    for(const [col,h] of bands){ x.fillStyle=col; x.fillRect(0,y+off,64,h); off+=h; }
    x.fillStyle='rgba(90,30,25,.16)'; x.fillRect(0,y+63,64,1.5);
  }
  return c;
}
// 百叶帘
function blindTex(){
  const [c,x]=cv(64,64);
  const g=x.createLinearGradient(0,0,0,64);
  g.addColorStop(0,'rgba(240,220,190,1)'); g.addColorStop(.5,'rgba(226,201,164,1)');
  g.addColorStop(.56,'rgba(158,120,80,.95)'); g.addColorStop(1,'rgba(206,178,140,1)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  return c;
}
// 窗外天光
function skyTex(){
  const [c,x]=cv(32,256);
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#dfe7ea'); g.addColorStop(.45,'#f0eeea'); g.addColorStop(1,'#e6e0d6');
  x.fillStyle=g; x.fillRect(0,0,32,256);
  return c;
}
// 混凝土
function concreteTex(){
  const [c,x]=cv(512,512);
  x.fillStyle='#9b9791'; x.fillRect(0,0,512,512);
  for(let i=0;i<40;i++){ const r=40+Math.random()*120;
    const g=x.createRadialGradient(Math.random()*512,Math.random()*512,0,Math.random()*512,Math.random()*512,r);
    g.addColorStop(0,`rgba(${Math.random()<.5?255:60},${Math.random()<.5?255:60},${Math.random()<.5?255:60},.04)`);
    g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,512,512);
  }
  noise(x,512,512,.05,1);
  return c;
}
/* ---- 真实感增强：凹凸 / 粗糙度 / 织物 / 石材 / 瓷砖 ---- */
// 木地板凹凸（与 woodTex 同一套板缝与纹理走向）
function woodBumpTex(){
  const [c,x]=cv(1024,1024), planks=7, ph=1024/planks;
  x.fillStyle='#808080'; x.fillRect(0,0,1024,1024);
  for(let p=0;p<planks;p++){
    const y0=p*ph;
    for(let g=0;g<60;g++){
      const gy=y0+Math.random()*ph, amp=Math.random()*4+1;
      x.strokeStyle=`rgba(${Math.random()<.5?40:215},${Math.random()<.5?40:215},${Math.random()<.5?40:215},.10)`;
      x.lineWidth=1.2+Math.random()*1.4; x.beginPath(); x.moveTo(0,gy);
      for(let sx=0;sx<=1024;sx+=32) x.lineTo(sx, gy+Math.sin(sx*0.007+g)*amp);
      x.stroke();
    }
    x.fillStyle='#1c1c1c'; x.fillRect(0,y0+ph-2,1024,2.5);
    for(let s=0;s<3;s++){ const sx=Math.random()*1024|0; x.fillStyle='#2a2a2a'; x.fillRect(sx,y0,2,ph); }
  }
  return c;
}
// 亚麻织物：经纬交织 + 不规则纤维
function linenTex(){
  const [c,x]=cv(256,256);
  x.fillStyle='#e9e3d8'; x.fillRect(0,0,256,256);
  for(let i=0;i<256;i+=2){
    x.fillStyle=`rgba(255,255,255,${.10+Math.random()*.08})`; x.fillRect(0,i,256,1);
    x.fillStyle=`rgba(120,108,92,${.07+Math.random()*.06})`; x.fillRect(i,0,1,256);
  }
  for(let i=0;i<900;i++){
    x.fillStyle=`rgba(${190+Math.random()*60|0},${180+Math.random()*55|0},${160+Math.random()*50|0},.16)`;
    x.fillRect(Math.random()*256|0, Math.random()*256|0, 2+Math.random()*4|0, 1);
  }
  noise(x,256,256,.05,1);
  return c;
}
// 织物凹凸（与 linenTex 同结构，用于 bumpMap）
function linenBump(){
  const [c,x]=cv(256,256);
  x.fillStyle='#7a7a7a'; x.fillRect(0,0,256,256);
  for(let i=0;i<256;i+=2){
    x.fillStyle=`rgba(255,255,255,${.16+Math.random()*.1})`; x.fillRect(0,i,256,1);
    x.fillStyle=`rgba(0,0,0,${.12+Math.random()*.08})`; x.fillRect(i,0,1,256);
  }
  noise(x,256,256,.10,1);
  return c;
}
// 拉毛/丝绒（单椅面料：长纤维 + 强凹凸）
function velvetTex(){
  const [c,x]=cv(256,256);
  x.fillStyle='#ffffff'; x.fillRect(0,0,256,256);
  for(let i=0;i<7000;i++){
    const v=170+Math.random()*85|0;
    x.fillStyle=`rgba(${v},${v},${v},.5)`;
    x.fillRect(Math.random()*256|0, Math.random()*256|0, 1, 1+Math.random()*3|0);
  }
  return c;
}
// 釉面瓷砖（含砖缝）
function tileTex(base='#dfe3e2', jw=5){
  const [c,x]=cv(512,512), n=2, s=512/n;
  x.fillStyle='#b9bdb9'; x.fillRect(0,0,512,512);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    x.fillStyle=base; x.fillRect(i*s+jw/2, j*s+jw/2, s-jw, s-jw);
    for(let k=0;k<26;k++){
      const gx=i*s+Math.random()*s, gy=j*s+Math.random()*s, r=18+Math.random()*70;
      const g=x.createRadialGradient(gx,gy,0,gx,gy,r);
      g.addColorStop(0,'rgba(255,255,255,.05)'); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.fillRect(i*s,j*s,s,s);
    }
  }
  noise(x,512,512,.015,1);
  return c;
}
// 水磨石 / 微水泥台面
function terrazzoTex(){
  const [c,x]=cv(512,512);
  x.fillStyle='#e7e3dc'; x.fillRect(0,0,512,512);
  const cols=['#b9b3a8','#8f8a80','#d8d2c7','#6f6a62','#c9bda6','#a8a49e'];
  for(let i=0;i<1500;i++){
    x.fillStyle=cols[Math.random()*cols.length|0];
    x.globalAlpha=.35+Math.random()*.45;
    const r=1.5+Math.random()*5;
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, r, r*(.5+Math.random()*.7), Math.random()*3, 0, 7); x.fill();
  }
  x.globalAlpha=1; noise(x,512,512,.04,1);
  return c;
}
// 大理石纹（浴室台面）
function marbleTex(){
  const [c,x]=cv(512,512);
  x.fillStyle='#f2f0ec'; x.fillRect(0,0,512,512);
  for(let i=0;i<26;i++){
    x.strokeStyle=`rgba(${110+Math.random()*40|0},${112+Math.random()*38|0},${116+Math.random()*36|0},${.06+Math.random()*.16})`;
    x.lineWidth=.6+Math.random()*3.4;
    let px=Math.random()*512, py=-10;
    x.beginPath(); x.moveTo(px,py);
    while(py<522){ py+=14+Math.random()*22; px+=(Math.random()-.5)*70; x.lineTo(px,py); }
    x.stroke();
  }
  noise(x,512,512,.02,1);
  return c;
}
// 拉丝金属（凹凸）
function brushedBump(){
  const [c,x]=cv(256,256);
  x.fillStyle='#808080'; x.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){
    const v=Math.random()<.5?0:255;
    x.fillStyle=`rgba(${v},${v},${v},.07)`;
    x.fillRect(0, Math.random()*256|0, 256, 1);
  }
  return c;
}
// 书脊色卡（真实书籍常见的低饱和色）
const BOOK_COLORS=[0x8d3b30,0x2f3b34,0xb5651d,0x3d4a63,0x7a6a53,0xd9cdbb,0x94564a,
                   0x2b2b2b,0xa8763e,0x5c6b52,0xc9a227,0x6f4e37,0xe0d7c6,0x40404a];
// 家具落地接触阴影（径向渐变贴地片）
function contactTex(){
  const [c,x]=cv(256,256);
  const g=x.createRadialGradient(128,128,10,128,128,124);
  g.addColorStop(0,'rgba(30,26,22,.42)'); g.addColorStop(.45,'rgba(30,26,22,.20)');
  g.addColorStop(1,'rgba(30,26,22,0)');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  return c;
}

function screenTex(){
  const [c,x]=cv(512,288);
  const g=x.createLinearGradient(0,0,512,288);
  g.addColorStop(0,'#1b2b3a'); g.addColorStop(.45,'#3f5f6d'); g.addColorStop(.75,'#c98a53'); g.addColorStop(1,'#f0c98a');
  x.fillStyle=g; x.fillRect(0,0,512,288);
  x.fillStyle='rgba(255,255,255,.55)';
  x.beginPath(); x.arc(392,96,34,0,7); x.fill();
  x.fillStyle='rgba(20,24,28,.55)';
  for(let i=0;i<5;i++){ const h=60+Math.random()*120;
    x.fillRect(40+i*96, 288-h, 62, h); }
  x.fillStyle='rgba(255,255,255,.06)';
  for(let y=0;y<288;y+=3) x.fillRect(0,y,512,1);
  return c;
}

const pickables = [];
function pick(obj, name, tag, desc, zones){
  obj.traverse(o=>{ if(o.isMesh){ o.material = o.material.clone(); o.userData.orig = {
    emissive:o.material.emissive ? o.material.emissive.getHex() : 0,
    intensity:o.material.emissiveIntensity ?? 1 }; }});
  obj.userData.info = { name, tag, desc, root:obj, zones: zones || ['all'] };
  pickables.push(obj);
  scene.add(obj);
  return obj;
}
function inZone(info, zoneId){
  const zs = info.zones || ['all'];
  return zs.includes('all') || zs.includes(zoneId);
}
function box(w,h,d,r=0.02,seg=2){ return new RoundedBoxGeometry(w,h,d,seg,Math.min(r,Math.min(w,h,d)/2.2)); }
function mesh(g,m,x=0,y=0,z=0){ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; return o; }
function slab(w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; return o; }

let TV = null, LAMP = null, SCREEN_TEX = null;
function screenTexture(){ return SCREEN_TEX || (SCREEN_TEX = T(SCREEN,1,1)); }
let lampOn = false, tvOn = false;         // 手动开关（双击）
function applyLamp(){
  if(!LAMP) return;
  const k = lampOn ? 1 : (night ? 0.4 : 0);   // 关着时夜间留一点余辉
  LAMP.traverse(o=>{
    if(o.isLight) o.intensity = 3.0 * k;
    if(o.isMesh && o.userData.orig){
      if(o.userData.role==='shade')
        o.material.emissiveIntensity = night ? (0.5 + k) : (0.12 + k*0.75);
      if(o.userData.role==='emit')
        o.material.emissiveIntensity = k ? 1.4 + 2.2*k : (night ? 0.9 : 0.3);
    }
  });
}
function applyTv(){
  if(!TV) return;
  const sc = TV.userData.screenMesh;
  if(!sc) return;
  const m = sc.material;
  if(tvOn){
    m.map = screenTexture(); m.emissiveMap = m.map;
    m.emissive.setHex(0xffffff); m.emissiveIntensity = night ? 1.15 : 0.95;
    m.color.setHex(0xffffff); m.needsUpdate = true;
  } else {
    m.map = null; m.emissiveMap = null;
    m.emissive.setHex(night ? 0x2a4a6a : 0x000000);
    m.emissiveIntensity = night ? 1.0 : 0;
    m.color.setHex(0x07080a); m.needsUpdate = true;
  }
}
function toggleAction(root){
  const t = root.userData.toggle;
  if(t==='lamp'){ lampOn=!lampOn; applyLamp(); return lampOn?'开灯': '关灯'; }
  if(t==='tv'){ tvOn=!tvOn; applyTv(); return tvOn?'开机':'关机'; }
  return null;
}
function role(o,r){ o.userData.role = r; return o; }

function labelSprite(text, sub){
  const [c,x]=cv(512,160);
  x.clearRect(0,0,512,160);
  x.fillStyle='rgba(28,26,23,.82)';
  const r=26,w=512,h=120;
  x.beginPath();
  x.moveTo(r,20); x.lineTo(w-r,20); x.quadraticCurveTo(w,20,w,20+r);
  x.lineTo(w,h-r-20+20); x.quadraticCurveTo(w,h-20,w-r,h-20);
  x.lineTo(r,h-20); x.quadraticCurveTo(0,h-20,0,h-r); x.lineTo(0,20+r); x.quadraticCurveTo(0,20,r,20);
  x.closePath(); x.fill();
  x.fillStyle='#f5f1ea'; x.textAlign='center';
  x.font='600 46px -apple-system,"PingFang SC","Noto Sans SC",sans-serif';
  x.fillText(text, 256, 82);
  if(sub){ x.fillStyle='rgba(245,241,234,.55)'; x.font='32px sans-serif'; x.fillText(sub, 256, 122); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest:false, depthWrite:false }));
  s.scale.set(1.9, 0.6, 1); s.renderOrder = 20;
  return s;
}

// 3 木质书架（分层 + 真实摆书：竖排、斜靠、平摞、横放）
(function(){
  const g=new THREE.Group();
  const W=0.42, Hh=2.05, L=1.7, rows=5;
  g.add(slab(W,Hh,0.04,M.oak,0,Hh/2,-L/2));
  g.add(slab(W,Hh,0.04,M.oak,0,Hh/2, L/2));
  g.add(slab(0.04,Hh,L,M.oak,-W/2,Hh/2,0));
  g.add(slab(0.04,Hh,L,M.oak, W/2,Hh/2,0));
  g.add(slab(0.04,Hh,L-0.04,M.wall,-W/2+0.02,Hh/2,0));         // 背板（贴墙一侧）
  const shelfY=[];
  for(let i=0;i<=rows;i++){
    const y=0.02+i*(Hh-0.06)/rows;
    shelfY.push(y);
    const s=slab(W-0.06,0.035,L-0.06,M.oak,0,y,0);
    g.add(s);
  }
  // 每层净高
  const gapY=(Hh-0.06)/rows;
  let seed=7;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const bookMat=(col)=>new THREE.MeshStandardMaterial({ color:col, roughness:.78 });
  for(let r=0;r<rows;r++){
    const y0=shelfY[r]+0.018;                       // 层板顶面
    let z=-L/2+0.10;
    const limit=L/2-0.10;
    if(r===2){                                       // 中间一层：平摞书 + 器物
      let h=y0;
      for(let k=0;k<4;k++){
        const th=0.028+rnd()*0.014;
        const b=mesh(box(W-0.10,th,0.24+rnd()*0.05,0.004),
          bookMat(BOOK_COLORS[(k*3+r)%BOOK_COLORS.length]), 0, h+th/2, -0.30);
        b.rotation.y=(rnd()-0.5)*0.10; g.add(b); h+=th+0.002;
      }
      g.add(mesh(new THREE.CylinderGeometry(0.055,0.075,0.16,16),M.ceramic,0,y0+0.08,0.34));
      continue;
    }
    while(z<limit-0.04){
      const mode=rnd();
      if(mode<0.62){                                  // 竖排成组
        const grp=2+Math.floor(rnd()*4);
        for(let k=0;k<grp && z<limit-0.03;k++){
          const t=0.020+rnd()*0.026;                  // 书厚
          const bh=0.20+rnd()*0.10;                   // 书高
          const bd=0.26+rnd()*0.06;                   // 书深（沿 x）
          const b=mesh(box(bd,bh,t,0.003), bookMat(BOOK_COLORS[(rnd()*BOOK_COLORS.length)|0]),
            (rnd()-0.5)*0.03, y0+bh/2, z+t/2);
          b.rotation.y=(rnd()-0.5)*0.03; g.add(b);
          z+=t+0.004;
        }
      } else if(mode<0.78){                           // 斜靠一本
        const t=0.024+rnd()*0.02, bh=0.24+rnd()*0.06;
        const b=mesh(box(0.28,bh,t,0.003), bookMat(BOOK_COLORS[(rnd()*BOOK_COLORS.length)|0]),
          0, y0+bh*0.42, z+t/2);
        b.rotation.x=0.28; g.add(b); z+=t+0.05;
      } else if(mode<0.90){                           // 平摞两本
        let h=y0;
        for(let k=0;k<2;k++){
          const th=0.030+rnd()*0.012;
          g.add(mesh(box(W-0.12,th,0.24,0.004), bookMat(BOOK_COLORS[(rnd()*BOOK_COLORS.length)|0]),
            0, h+th/2, z+0.12));
          h+=th+0.002;
        }
        z+=0.26;
      } else { z+=0.06+rnd()*0.05; }                  // 留白
    }
    // 层间小器物点缀
    if(r===4) g.add(mesh(new THREE.SphereGeometry(0.062,14,10), M.bowl, 0.02, y0+0.06, L/2-0.20));
  }
  g.position.set(-3.85,0.40,-2.9);
  g.add(contact(0.06,0,0.52,1.9,0.41));
  pick(g,'木质开放书架','家具 / FURNITURE','橡木五层格架，竖排、斜靠与平摞的书籍搭配陶器陈列，同时界定地台边界。', ['deck']);
})();

// 4 花器与枝条（CatmullRom 曲线生成连贯主枝 + 分枝，叶片沿曲线连续排布）
(function(){
  const g=new THREE.Group();
  const v=mesh(new THREE.CylinderGeometry(0.09,0.13,0.34,20),M.ceramic,0,0.17,0); g.add(v);
  g.add(mesh(new THREE.CylinderGeometry(0.055,0.09,0.08,20),M.ceramic,0,0.37,0));
  const LEAF=new THREE.SphereGeometry(0.042,8,6);
  function stem(pts, leafDensity){
    const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)), false, 'catmullrom', 0.4);
    const m=new THREE.Mesh(new THREE.TubeGeometry(curve, 44, 0.0115, 7, false), M.branch);
    m.castShadow=true; m.receiveShadow=true; g.add(m);
    const n=Math.max(3, Math.round(curve.getLength()*leafDensity));
    for(let i=1;i<=n;i++){
      const t=i/(n+1), p=curve.getPointAt(t), tan=curve.getTangentAt(t);
      const side=(i%2?1:-1);
      const leaf=new THREE.Mesh(LEAF, M.leaf);
      const perp=new THREE.Vector3(-tan.z,0,tan.x);
      if(perp.lengthSq()<1e-6) perp.set(1,0,0);
      perp.normalize().multiplyScalar(side*0.055);
      leaf.position.copy(p).add(perp).add(new THREE.Vector3(0,0.014,0));
      leaf.scale.set(0.55,0.28,1.5);
      leaf.lookAt(leaf.position.clone().add(tan));
      leaf.rotateZ(side*0.5);
      leaf.castShadow=true; g.add(leaf);
    }
    return curve;
  }
  // 3 根主枝：自瓶口出发，弧度连贯向外舒展
  const mains=[
    [[0,0.34,0],[0.02,0.62,-0.03],[-0.06,0.95,-0.16],[-0.02,1.28,-0.34],[0.12,1.55,-0.52]],
    [[0,0.34,0],[0.03,0.60,0.04],[0.14,0.90,0.10],[0.20,1.18,-0.05],[0.14,1.44,-0.24]],
    [[0,0.34,0],[-0.03,0.58,0.02],[-0.14,0.86,0.12],[-0.26,1.10,0.02],[-0.30,1.32,-0.16]],
  ].map(p=>stem(p,7));
  // 分枝：起点接在主枝上，与主枝同向续接，避免"断开"观感
  const subs=[
    [[-0.02,1.28,-0.34],[-0.14,1.42,-0.44],[-0.30,1.52,-0.50]],
    [[0.20,1.18,-0.05],[0.34,1.30,-0.10],[0.44,1.40,-0.24]],
    [[-0.26,1.10,0.02],[-0.40,1.20,0.10],[-0.48,1.28,0.02]],
    [[0.14,0.90,0.10],[0.26,1.00,0.22],[0.30,1.12,0.24]],
  ].map(p=>stem(p,9));
  void mains; void subs;
  g.position.set(0.35,0.40,-3.5);
  pick(g,'插花枝条','陈设 / STYLING','一株舒展的枝条 + 素色陶器，是地台尽端的视觉焦点。', ['deck']);
})();

const ray = new THREE.Raycaster();

// three 的 Raycaster 不检查 visible，自行过滤隐藏物体
function visibleUp(o){ let p=o; while(p){ if(p.visible===false) return false; p=p.parent; } return true; }

function infoOf(o){ let p=o; while(p){ if(p.userData.info) return p.userData.info; p=p.parent; } return null; }
function tint(root, on){

    if(!o.isMesh || !o.userData.orig || !o.material.emissive) return;
    if(on){ o.material.emissive.setHex(0x2f6bff); o.material.emissiveIntensity = 0.42; }
    else { o.material.emissive.setHex(o.userData.orig.emissive); o.material.emissiveIntensity = o.userData.orig.intensity; }
  });
}
function select(root, fromList){

  if(selected===root){ deselect(); return; }

let actTimer = null;

function flashAction(root, label){

function deselect(){

  selected=null; card.classList.remove('show'); dot.classList.remove('show');
  setAct('');
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));

function castAt(cx,cy){
  ptr.set(((cx-RLEFT)/VW)*2-1, -((cy-RTOP)/VH)*2+1);
  ray.setFromCamera(ptr, camera);
  const list = (mode==='room' && currentZone)
    ? pickables.filter(pk=>inZone(pk.userData.info, currentZone)) : pickables;
  const hits = ray.intersectObjects(list, true).filter(h=>visibleUp(h.object));
  return hits.length ? infoOf(hits[0].object) : null;
}
const _hit = new THREE.Vector3();
function castZone(cx,cy){
  ptr.set(((cx-RLEFT)/VW)*2-1, -((cy-RTOP)/VH)*2+1);
  ray.setFromCamera(ptr, camera);
  return ray.ray.intersectPlane(FLOOR_PLANE, _hit) ? zoneAtPoint(_hit) : null;
}
// 拉到很远时整个平面只剩几十像素，手指点不准 → 允许 48px（约一根指宽）容差，就近进入最近的空间
const _pc = new THREE.Vector3();
const QUAD = [];
function planQuad(){
  let x0=1e9, x1=-1e9, z0=1e9, z1=-1e9;
  for(const q of ZONES){ const [a,b,c,d]=q.rect;
    x0=Math.min(x0,a); x1=Math.max(x1,b); z0=Math.min(z0,c); z1=Math.max(z1,d); }
  QUAD.length=0;
  for(const [x,z] of [[x0,z0],[x1,z0],[x1,z1],[x0,z1]]){
    _pc.set(x,0,z).project(camera);
    if(_pc.z>1) return false;
    QUAD.push(RLEFT+(_pc.x*0.5+0.5)*VW, RTOP+(-_pc.y*0.5+0.5)*VH);
  }
  return true;
}
function insideQuad(cx,cy){
  let sign=0;
  for(let i=0;i<4;i++){
    const ax=QUAD[i*2], ay=QUAD[i*2+1], j=(i+1)%4;
    const cr=(QUAD[j*2]-ax)*(cy-ay) - (QUAD[j*2+1]-ay)*(cx-ax);
    if(Math.abs(cr)<1e-9) continue;
    const s=cr>0?1:-1;
    if(sign===0) sign=s; else if(s!==sign) return false;
  }
  return true;
}
function distToQuad(cx,cy){
  let best=1e9;
  for(let i=0;i<4;i++){
    const ax=QUAD[i*2], ay=QUAD[i*2+1], j=(i+1)%4;
    const dx=QUAD[j*2]-ax, dy=QUAD[j*2+1]-ay, L=dx*dx+dy*dy;
    let t = L ? ((cx-ax)*dx+(cy-ay)*dy)/L : 0;
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(cx-ax-t*dx, cy-ay-t*dy));
  }
  return best;
}
function zoneNear(cx,cy){
  if(!planQuad()) return null;
  if(!insideQuad(cx,cy) && distToQuad(cx,cy) > 48) return null;
  let best=null, bd=1e9;
  for(const z of ZONES){
    const [x0,x1,z0,z1]=z.rect;
    _pc.set((x0+x1)/2, z.y, (z0+z1)/2).project(camera);
    if(_pc.z>1) continue;
    const d=Math.hypot(RLEFT+(_pc.x*0.5+0.5)*VW-cx, RTOP+(-_pc.y*0.5+0.5)*VH-cy);
    if(d<bd){ bd=d; best=z; }
  }
  return best;
}
function zonePick(cx,cy){ return castZone(cx,cy) || zoneNear(cx,cy); }
let down=null;
// 双击（两次快速轻点，同一物体）→ 开关类物件开/关
let lastTap = { root:null, t:-1e9, x:0, y:0 };
canvas.addEventListener('pointerdown', e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup', e=>{
  if(!down) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y);
  const quick = moved<7 && performance.now()-down.t<700;
  if(quick){
    const now = performance.now();
    const dbl = lastTap.root && (now-lastTap.t<420) &&
                Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y)<24;
    if(mode === 'overview'){
      const z = zonePick(e.clientX,e.clientY);
      if(z) enterRoom(z);
      lastTap.root = null;
    } else {
      const i = castAt(e.clientX,e.clientY);
      if(i){
        if(dbl && i.root === lastTap.root && i.root.userData.toggle){
          const label = toggleAction(i.root);
          if(label) flashAction(i.root, label);
          lastTap.root = null;              // 消费掉，避免三连击反复切换
        } else {
          select(i.root);
          lastTap = { root:i.root, t:now, x:e.clientX, y:e.clientY };
        }
      } else { deselect(); lastTap.root = null; }
    }
  }
  down=null;
});

/* ---------- 视角动画 ---------- */
const cam = { from:new THREE.Vector3(), to:new THREE.Vector3(), tfrom:new THREE.Vector3(), tto:new THREE.Vector3(), t:1 };
function flyTo(px,py,pz, tx,ty,tz){
  cam.from.copy(camera.position); cam.to.set(px,py,pz);
  cam.tfrom.copy(controls.target); cam.tto.set(tx,ty,tz); cam.t=0;
}
function tickCam(dt){
  if(cam.t>=1) return;
  cam.t = Math.min(1, cam.t + dt*1.15);
  const k = cam.t<.5 ? 4*cam.t**3 : 1-Math.pow(-2*cam.t+2,3)/2;
  camera.position.lerpVectors(cam.from,cam.to,k);
  controls.target.lerpVectors(cam.tfrom,cam.tto,k);
}
function focusOn(root){
  const b = new THREE.Box3().setFromObject(root);
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const r = Math.max(s.x,s.y,s.z);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const p = c.clone().add(dir.multiplyScalar(Math.max(1.5, r*2.6))).setY(Math.max(c.y+r*0.75, 0.7));
  flyTo(p.x,p.y,p.z, c.x,c.y,c.z);
}

// 精确取景：把包围盒 8 个角点投影到相机基，求刚好框住所需的最小距离
function frameDist(box, target, dir, pad=1.1){
  const D = dir.clone().normalize();
  const right = new THREE.Vector3().crossVectors(camera.up, D).normalize();
  const up = new THREE.Vector3().crossVectors(D, right).normalize();
  const vFov = camera.fov*Math.PI/180, tanV = Math.tan(vFov/2);
  const tanH = tanV * Math.max(0.35, VW/Math.max(1,VH));
  let need = 0;
  for(const x of [box.min.x, box.max.x]) for(const y of [box.min.y, box.max.y]) for(const z of [box.min.z, box.max.z]){
    const a = new THREE.Vector3(x,y,z).sub(target);
    const az = a.dot(D);
    need = Math.max(need, az + Math.abs(a.dot(right))/tanH, az + Math.abs(a.dot(up))/tanV);
  }
  return need * pad + 0.4;
}
const OVER_DIR = new THREE.Vector3(0.45, 0.95, 0.78).normalize();  // ≈50° 轴测俯视
function fitAll(){
  const t = MC.clone();
  const d = frameDist(MODEL, t, OVER_DIR, 1.10);
  return { p: t.clone().add(OVER_DIR.clone().multiplyScalar(d)), t, d };
}
function applyFit(){ const { p, t } = fitAll(); flyTo(p.x,p.y,p.z, t.x,t.y,t.z); }
// 室内机位：目标点固定，位置按视口比例沿视线外推，窄屏不会被裁掉
function indoorView(pos, tgt, need){
  const a = Math.max(0.35, VW/Math.max(1,VH));
  const vFov = camera.fov*Math.PI/180;
  const hFov = 2*Math.atan(Math.tan(vFov/2)*a);
  const k = need / (2*Math.tan(Math.min(vFov,hFov)/2));
  const P = new THREE.Vector3(...pos), T = new THREE.Vector3(...tgt);
  const dir = P.clone().sub(T);
  const len = Math.max(dir.length(), Math.min(k, 14));
  return P.copy(T).add(dir.normalize().multiplyScalar(len));
}

/* ---------- 分层导航：全屋俯瞰 ⇄ 单房间 ---------- */
let mode = 'overview', inFit = true, currentZone = null;
const bReset = document.getElementById('bReset');
const btns = document.querySelector('.btns');
const chips = document.getElementById('chips');
const zoneBtns = new Map();
function fillChips(list){
  while(chips.firstChild) chips.removeChild(chips.firstChild);
  for(const c of list) chips.appendChild(c);
}

function setZoneHover(z){
  for(const q of ZONES){
    const on = (q === z);
    q.plate.material.opacity = on ? 0.2 : 0.06;
    q.edge.material.opacity  = on ? 1.0 : 0.45;
    q.label.material.opacity = on ? 1.0 : 0.82;
  }
  hoveredZone = z;
}
function showZones(on){
  for(const q of ZONES) q.group.visible = on;
  if(!on) hoveredZone = null;
}
function enterRoom(z){
  mode = 'room';
  currentZone = z.id;
  document.getElementById('sub').textContent = '当前：' + z.name + ' — 点击家具查看名称';
  deselect();
  showZones(false);
  roofGroup.visible = !z.doll;                    // 小房间沿用娃娃屋剖切，从上方看进去
  sky.visible = !z.doll;                          // 室内需要窗外天光板（大房间）
  let p, tgt;
  if(z.doll){
    // 娃娃屋机位：俯视斜切进入小房间，用包围盒 8 角点精确取景
    const [x0,x1,z0,z1] = z.rect;
    const bb = new THREE.Box3(new THREE.Vector3(x0, 0, z0), new THREE.Vector3(x1, 2.35, z1));
    tgt = new THREE.Vector3(...z.view.tgt);
    const dir = new THREE.Vector3(...z.view.dir).normalize();
    const d = frameDist(bb, tgt, dir, 1.06);
    p = tgt.clone().add(dir.multiplyScalar(d));
    controls.minDistance = 0.5; controls.maxDistance = 24;
  } else {
    p = indoorView(z.view.pos, z.view.tgt, z.view.need);
    tgt = new THREE.Vector3(...z.view.tgt);
    controls.minDistance = 0.6; controls.maxDistance = 120;
  }
  flyTo(p.x,p.y,p.z, tgt.x,tgt.y,tgt.z);
  fillChips(pickables.filter(pk=>inZone(pk.userData.info, z.id)).map(pk=>{
    const c=document.createElement('div'); c.className='chip';
    c.textContent = pk.userData.info.name; c.dataset.n = pk.userData.info.name;
    c.onclick=()=>{ select(pk); focusOn(pk); };
    return c;
  }));
  bReset.textContent = '← 返回全屋';
  zoneBtns.forEach((b,id)=>b.classList.toggle('on', id===z.id));
  inFit = false;
}
function goOverview(){
  mode = 'overview';
  currentZone = null;
  document.getElementById('sub').textContent = 'WARM MINIMAL LIVING ROOM — 全屋俯瞰';
  deselect();
  roofGroup.visible = false;                      // 娃娃屋剖切：直接看进各房间
  sky.visible = false;                            // 俯瞰不需要窗外天光板
  showZones(true); setZoneHover(null);
  controls.minDistance = 4; controls.maxDistance = 320;
  applyFit();
  fillChips(ZONES.map(z=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent='▸ '+z.name;
    c.onclick=()=>enterRoom(z);
    return c;
  }));
  bReset.textContent = '复位';
  zoneBtns.forEach(b=>b.classList.remove('on'));
  inFit = true;
}

const VIEWS = [
  ['全屋',       'overview', null],
  ['会客区',     'living',   null],
  ['地台阅读区', 'deck',     null],
  ['影音墙',     'tv',       null],
  ['浴室',       'bath',     null],
  ['衣帽间',     'closet',   null],
];
for(const [label, key] of VIEWS){
  const b=document.createElement('button'); b.className='btn'; b.textContent=label;
  b.onclick=()=>{
    if(key === 'overview') goOverview();
    else { const z = ZONES.find(q=>q.id===key); if(z) enterRoom(z); }
    zoneBtns.forEach((x,id)=>x.classList.toggle('on', id===key));
  };
  zoneBtns.set(key, b);
  btns.appendChild(b);
}
bReset.onclick=()=>{ mode==='overview' ? applyFit() : goOverview(); };
const bSpin=document.getElementById('bSpin');
bSpin.onclick=()=>{ controls.autoRotate=!controls.autoRotate; bSpin.classList.toggle('on',controls.autoRotate); };

let night=false;
const bDay=document.getElementById('bDay');
function setRole(role, hex, inten, except){
  scene.traverse(o=>{
    if(o.isMesh && o.userData.role===role && o.material.emissive){
      if(except){ let p=o.parent, skip=false; while(p){ if(p===except){ skip=true; break; } p=p.parent; } if(skip) return; }
      o.material.emissive.setHex(hex); o.material.emissiveIntensity=inten;
      if(o.userData.orig){ o.userData.orig.emissive=hex; o.userData.orig.intensity=inten; }
    }
  });
}
bDay.onclick=()=>{
  night=!night; bDay.textContent=night?'夜灯':'日光'; bDay.classList.toggle('on',night);
  hemi.intensity = night?0.16:1.0; amb.intensity = night?0.05:0.2;
  sun.intensity = night?0.05:2.3; fill.intensity = night?0.06:0.75;
  fill2.intensity = night?0.03:0.3; bounce.intensity = night?0.1:0.3;
  // 天花灯带/射灯受日光开关控制；落地灯与电视由手动开关优先
  setRole('shade', 0xffe6c0, night?1.5:0.12, LAMP);
  setRole('emit',  0xfff3dd, night?3.6:2.2, LAMP);
  applyLamp(); applyTv();
  scene.background.set(night?0x161a1e:0xe9e5df);
  scene.fog.color.copy(scene.background);
  sky.material.color.set(night?0x242a31:0xffffff);
  if(selected) tint(selected,true);
};
document.getElementById('cardFocus').onclick=()=>{ if(selected) focusOn(selected); };
document.getElementById('cardClose').onclick=deselect;


/* ---------- 循环 ---------- */
let last=performance.now();
const _v=new THREE.Vector3();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  tickCam(dt); controls.update(); clampTarget();
  if(selected){
    const b=new THREE.Box3().setFromObject(selected);
    b.getCenter(_v); _v.project(camera);
    const vis = _v.z<1;
    dot.style.opacity = vis?1:0;
    if(vis) dot.style.transform=`translate(${(_v.x*.5+.5)*VW+RLEFT}px, ${(-_v.y*.5+.5)*VH+RTOP}px)`;
  }
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);

/* ---------- 初始状态：全屋俯瞰 ---------- */
{ const { p, t } = fitAll(); camera.position.copy(p); controls.target.copy(t); }
roofGroup.visible = false;
controls.minDistance = 4; controls.maxDistance = 320;
fillChips(ZONES.map(z=>{
  const c=document.createElement('div'); c.className='chip'; c.textContent='▸ '+z.name;
  c.onclick=()=>enterRoom(z); return c;
}));
zoneBtns.get('overview').classList.add('on');
controls.addEventListener('start', ()=>{ inFit = false; });

/* 全屋模式下限制平移范围：户型永远拖不出视野，也就不存在"丢了画面"的死角 */
function clampTarget(){
  if(mode !== 'overview') return;
  const t = controls.target, m = 1.5;
  const cx = Math.min(MODEL.max.x + m, Math.max(MODEL.min.x - m, t.x));
  const cy = Math.min(MODEL.max.y + m, Math.max(-0.6, t.y));
  const cz = Math.min(MODEL.max.z + m, Math.max(MODEL.min.z - m, t.z));
  if(cx===t.x && cy===t.y && cz===t.z) return;
  const dx = cx - t.x, dy = cy - t.y, dz = cz - t.z;
  t.set(cx, cy, cz);
  camera.position.x += dx; camera.position.y += dy; camera.position.z += dz;  // 相机跟随，画面不跳
}

function onViewportChange(){
  const pw=VW, ph=VH;
  measure();
  if(Math.abs(pw-VW)<1.5 && Math.abs(ph-VH)<1.5) return;
  camera.aspect=VW/VH; camera.updateProjectionMatrix();
  renderer.setSize(VW,VH,false);
  if(inFit && mode==='overview'){ const { p, t } = fitAll(); camera.position.copy(p); controls.target.copy(t); }
}
addEventListener('resize', onViewportChange, {passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', onViewportChange);
  window.visualViewport.addEventListener('scroll', onViewportChange);
}

// 预热一帧后收起 loading
renderer.render(scene,camera);
requestAnimationFrame(()=>document.getElementById('load').classList.add('gone'));
setTimeout(()=>{ const t=document.getElementById('tip'); if(t) t.style.opacity=0; }, 6000);
</script>
